[package]
name = "arsy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "arsy"
path = "src/main.rs"

[features]
default = ["tui"]
tui = []
dap = ["arsy-code/dap"]
wasm = ["arsy-code/wasm"]
remote-transports = ["arsy-code/remote-transports"]

[dependencies]
arsy-code = { version = "0.1.0", path = "../arsy-code" }
arsy-kernel = { version = "0.1.0", path = "../arsy-kernel", features = ["http"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width = "=0.2.2"

[dev-dependencies]
# The reference thin client, so the pair can be tested as a pair. The
# dependency runs this way round because the client depends on nothing.
arsy-ide = { version = "0.1.0", path = "../arsy-ide" }
tempfile.workspace = true

[lints]
workspace = true
