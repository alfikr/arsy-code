[package]
name = "arsy-pty"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A pseudoterminal cannot be opened without calling into libc, and the rest of
# the workspace forbids `unsafe`. Keeping those calls in a crate of their own,
# the way `arsy-sandbox` already does, is what lets the relaxation be reviewed
# as one small file rather than granted to thirty thousand lines of harness.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
