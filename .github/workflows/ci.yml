name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Rust 1.85
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux credential-store dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install MSRV with lint components
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +1.85.0 test --workspace --all-features --locked
      - name: Compatibility fixtures
        run: python3 fixtures/compat/check.py

  dependencies:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
