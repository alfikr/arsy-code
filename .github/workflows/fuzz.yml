name: Fuzz

# Fast deterministic tests gate every change; the fuzzers run long on a
# schedule (docs/30-testing-strategy.md).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Long soak; local runs keep the proptest default of 256 cases.
      PROPTEST_CASES: "20000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux credential-store dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install MSRV
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Glob and artifact decoder
        run: cargo +1.98.0 test -p arsy-kernel --test fuzz --locked
      - name: Path, command, and edit decoder
        run: cargo +1.98.0 test -p arsy-code --test fuzz --locked
      - name: Upload regression fixtures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proptest-regressions
          path: "**/*.proptest-regressions"
          if-no-files-found: ignore
