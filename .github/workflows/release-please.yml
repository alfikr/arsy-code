name: release-please

# Version, changelog, contributor attribution, and GitHub Release preparation.
# A maintainer starts preparation manually. Ordinary PR merges are ignored.
#
# Preparation only: merging the release pull request tags the release, and the
# tag push is what runs `release.yml`, whose completion runs `npm-publish.yml`.
# This workflow deliberately does not call either. Calling them built every
# target a second time, and npm refuses a publish that arrives through
# `workflow_call` because the trusted publisher is registered against
# `npm-publish.yml` rather than against whatever called it.
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT rather than github.token: pull requests opened with GITHUB_TOKEN do not
          # trigger workflow events, so CI never ran on the release pull request itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-type "simple" rewrites Cargo.toml through extra-files but knows
      # nothing about Cargo.lock, and every build in this repo runs --locked. Left
      # alone, CI on the release pull request fails with "the lock file needs to be
      # updated" before a human ever looks at it.
      - name: Sync Cargo.lock to the proposed version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")
          if [ -z "$branch" ]; then
            branch=$(gh pr list --state open --label "autorelease: pending" \
              --json headRefName --jq '.[0].headRefName')
          fi
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to sync"
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          # No --offline: the runner has never fetched the crates.io index,
          # so resolving even a workspace member fails without it.
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: sync Cargo.lock to the release version"
          git push origin "$branch"

      - name: Attribute contributors in changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")
          if [ -z "$branch" ]; then
            branch=$(gh pr list --state open --label "autorelease: pending" \
              --json headRefName --jq '.[0].headRefName')
          fi
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to attribute"
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          python3 .github/scripts/attribute_changelog.py CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog already attributed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: attribute changelog contributors"
          git push origin "$branch"

      - name: Use attributed changelog as release notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          git checkout main
          version="${TAG#v}"
          awk -v h="## [$version](" '
            index($0, h) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ] && grep -q '^### ' release-notes.md; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "no attributed changelog block; leaving release notes unchanged"
          fi
          rm -f release-notes.md
