name: CLA Assistant

# Contributor License Agreement enforcement for repos that accept external
# code. Requires at repo root: CLA.md, and the labels 'cla: signed' /
# 'cla: not signed' (see internal_doc/docs/cla.md).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Labels below are applied with app credentials rather than
      # GITHUB_TOKEN, so every label on a pull request arrives from
      # suiflex-bot — the same identity used by suiflex.yml — instead of
      # splitting the row between two bots. The CLA step itself keeps
      # GITHUB_TOKEN: it pushes to the cla-signatures branch of this
      # repository, which is this workflow's own token's job.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SUIFLEX_BOT_APP_ID }}
          private-key: ${{ secrets.SUIFLEX_BOT_PRIVATE_KEY }}

      - name: CLA Assistant Lite
        id: cla
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/suiflex/arsy-code/blob/main/CLA.md
          branch: cla-signatures
          allowlist: mulhamna,badrus123,*[bot]
          # `custom-notsigned-prcomment`, not `custom-notsigned-comment`. The
          # action ignores an unknown input with only a warning, so the wrong
          # name silently falls back to the default text instead of failing.
          custom-notsigned-prcomment: >
            Thanks for your contribution! Before we can merge, please read our
            [Contributor License Agreement](https://github.com/suiflex/arsy-code/blob/main/CLA.md)
            and sign it by posting the comment below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA ✅
          lock-pullrequest-aftermerge: false

      # A commit status cannot be filtered from the pull request list, so the
      # signing state is mirrored onto a label as well. Create both labels
      # once (idempotent):
      #
      #   gh label create 'cla: signed' --repo suiflex/arsy-code --force \
      #     --color 4ade80 --description 'Contributor has signed the CLA · suiflex-bot'
      #   gh label create 'cla: not signed' --repo suiflex/arsy-code --force \
      #     --color bf8700 --description 'Contributor has not signed the CLA · suiflex-bot'
      #
