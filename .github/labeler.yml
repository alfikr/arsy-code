# Path -> label map for the PR area labeler (the `label` job in
# .github/workflows/suiflex.yml).
#
# One entry per component/area of arsy-code. A reviewer can tell from
# the label row which parts of the repository a pull request touches without
# opening the diff. Keep entries aligned with the repo's actual layout.

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arsy-cli/**"

"area: kernel":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arsy-kernel/**"

"area: sandbox":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arsy-sandbox/**"

"area: ide":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arsy-ide/**"

"area: code":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arsy-code/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Makefile"
          - "deny.toml"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
