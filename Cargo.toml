[workspace]
members = ["crates/arsy-kernel", "crates/arsy-code", "crates/arsy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/suiflex/arsy-code"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.11.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
zstd = { version = "=0.13.3", default-features = false }
globset = "=0.4.19"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
